<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Resset Password</title>
    <!-- meta -->
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- styles -->
    {% block css %}{% endblock %}
    <style>
      /* custom styles */

      body {
        padding-top: 70px;
      }

      .container{
        padding: 20px;
        background: #FCFCFC;
        width: 96%;
        margin: 0 auto;
      }

      a.button {
          -webkit-appearance: button;
          -moz-appearance: button;
          appearance: button;

          text-decoration: none;

          color: #fff;
          padding: 10px;
          text-align: center;
          border-radius: 6px;
          background-image: linear-gradient(to bottom, #335dee, #244fe3);
          font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <p>Hi {{ username }}!</p>
      <p>A password reset request has been received from your account.</p>
      <p></p>
      <p>Click on the following link to reset your password:</p>
      <p><a href="{{ url }}" class="button btn">Reset Password</a></p>
      <br>
      <p>If you didn't request it, you can ignore this email.</p>
      <p><p/>
      <p>Cheers!</p>

    </div>
    <!-- scripts -->
    <script src="{{url_for('static', filename='main.js')}}" type="text/javascript"></script>
    {% block js %}{% endblock %}

  </body>
</html>
